# PostgreSQL for checkpoints and the ledger. Bound to localhost only. Copy .env.example to .env and set a password first.
services:
  keiri-pg:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: keiri
      POSTGRES_PASSWORD: ${KEIRI_PG_PASSWORD:?set KEIRI_PG_PASSWORD}
      POSTGRES_DB: keiri
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - keiri-pg-data:/var/lib/postgresql/data
volumes:
  keiri-pg-data:
